[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
# ADR-012: PUSH0, MCOPY and TSTORE verified on Mezo testnet; OpenZeppelin 5.6 needs MCOPY.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Third-party code (e.g. Pyth's MockPyth) is not ours to fix.
ignored_warnings_from = ["node_modules"]
# Fork tests (test/fork/*, contracts named *ForkTest) need a live RPC; run them with
# FOUNDRY_PROFILE=fork.
no_match_contract = "ForkTest$"
# Deploy scripts read deployments/config/ and write deployments/<network>.json.
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 64
# Handlers only make calls whose preconditions hold, so any revert is a bug worth seeing.
fail_on_revert = true

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 256
depth = 128

[profile.fork]
match_contract = "ForkTest$"
no_match_contract = "^$"

[rpc_endpoints]
mezo_testnet = "${MEZO_TESTNET_RPC}"
